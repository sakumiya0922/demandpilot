x-python: &python
  image: demandpilot:local
  build: .
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-demandpilot}
    POSTGRES_USER: ${POSTGRES_USER:-demandpilot}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demandpilot_local}
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demandpilot}
      POSTGRES_USER: ${POSTGRES_USER:-demandpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demandpilot_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  pipeline:
    <<: *python
    profiles: ["tools"]
    entrypoint: ["demandpilot"]
    command: ["check-db"]

  app:
    <<: *python
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    restart: unless-stopped

volumes:
  postgres_data:
