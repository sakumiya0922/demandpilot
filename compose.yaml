x-python: &python
  image: demandpilot:local
  build: .
  environment:
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_EXPERIMENT_NAME: DemandPilot
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-demandpilot}
    POSTGRES_USER: ${POSTGRES_USER:-demandpilot}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demandpilot_local}
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts
  depends_on:
    db:
      condition: service_healthy
    mlflow:
      condition: service_healthy

services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --allowed-hosts
      - "localhost:5000,127.0.0.1:5000,mlflow:5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demandpilot}
      POSTGRES_USER: ${POSTGRES_USER:-demandpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demandpilot_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  pipeline:
    <<: *python
    profiles: ["tools"]
    entrypoint: ["demandpilot"]
    command: ["check-db"]

  app:
    <<: *python
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    restart: unless-stopped

volumes:
  mlflow_data:
  postgres_data:
