[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demandpilot"
version = "0.1.0"
description = "Demand forecasting and replenishment simulation portfolio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.2.3",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.2.5",
  "lightgbm==4.6.0",
  "mlflow-skinny==3.17.1",
  "scikit-learn==1.6.1",
  "streamlit==1.42.2",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
demandpilot = "demandpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
